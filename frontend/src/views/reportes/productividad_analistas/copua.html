<div class="breadcrumbs">
    <span onclick="showView('landing')">Inicio</span> /
    <span onclick="window.location.hash='#/productividad_analistas'" style="cursor: pointer;">Productividad Analistas</span> /
    <strong>COPUA</strong>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 15px;">
    <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: #eff6ff; color: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;">
            <i class="fa-solid fa-users-gear"></i>
        </div>
        <div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <h1 class="landing-title" style="margin: 0;">COPUA</h1>
                <span class="badge-builtin" style="background: #eff6ff; color: #3b82f6; font-weight: 700; font-size: 0.78rem; padding: 3px 10px; border-radius: 12px;">DGIUR</span>
            </div>
            <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.92rem;">Monitoreo de tareas resueltas, stock en bandeja, ratios y actividad SADE de analistas.</p>
        </div>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
        <button type="button" id="prod-copua-reporte-pdf-btn" class="btn-primary" style="padding: 9px 16px; font-family: 'Outfit'; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; border-radius: 8px; background: #dc2626; color: white; box-shadow: 0 2px 4px rgba(220,38,38,0.2);">
            <i class="fa-solid fa-file-pdf"></i> Reporte Comparativo (PDF)
        </button>
        <button type="button" onclick="window.location.hash='#/productividad_analistas'" class="btn-secondary" style="padding: 9px 16px; border: 1px solid #cbd5e1; background: white; border-radius: 8px; font-family: 'Outfit'; font-weight: 700; cursor: pointer; font-size: 0.88rem; color: #334155; display: inline-flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-arrow-left"></i> Volver a Gerencias
        </button>
    </div>
</div>

<!-- KPIs del Sector -->
<div class="metrics-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 2rem;" id="prod-copua-cards">
    <!-- Dinámico -->
</div>

<!-- Tabla de Analistas -->
<div class="admin-card" style="background: white; border-radius: 16px; border: 1px solid #cbd5e1; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04); margin-bottom: 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 12px;">
        <div>
            <h4 style="margin: 0; color: var(--primary-dark); font-family: 'Outfit'; font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-users" style="color: #3b82f6;"></i> Analistas Asignados
            </h4>
            <p id="prod-copua-analistas-count" style="margin: 2px 0 0 0; font-size: 0.8rem; color: #64748b;">Listado de analistas asignados a esta gerencia.</p>
        </div>
        <div style="position: relative; width: 280px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.85rem;"></i>
            <input type="text" id="prod-copua-search" placeholder="Buscar por usuario o nombre..." oninput="filterProductividadGerenciaTable('copua', this.value)" style="width: 100%; padding: 8px 12px 8px 32px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Outfit'; font-size: 0.85rem; outline: none; background: white;">
        </div>
    </div>

    <div class="table-responsive" style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden;">
        <table class="report-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="border-bottom: 2px solid #cbd5e1; background: #f8fafc; text-align: left; font-size: 0.82rem;">
                    <th style="padding: 12px 14px; font-weight: 700; color: #475569;">Usuario SADE</th>
                    <th style="padding: 12px 14px; font-weight: 700; color: #475569;">Nombre y Apellido</th>
                    <th style="padding: 12px 14px; font-weight: 700; color: #475569; text-align: center;">Estado</th>
                    <th style="padding: 12px 14px; font-weight: 700; color: #475569; text-align: center;">Acción</th>
                </tr>
            </thead>
            <tbody id="prod-copua-table-body" style="font-size: 0.88rem;">
                <!-- Dinámico -->
            </tbody>
        </table>
    </div>
</div>
