<div class="breadcrumbs">
    <span onclick="showView('landing')">Inicio</span> / <span onclick="window.location.hash='#/backlog'" style="cursor: pointer;">Backlog</span> / Configuración de Roles
</div>

<div class="admin-page-container" style="margin-top: 1rem;">
    
                <button type="button" onclick="showBacklogMenu()"
                    style="background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; margin-bottom: 1.5rem; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 6px; font-family: 'Outfit'; font-weight: 600;">
                    <i class="fa-solid fa-arrow-left"></i> Volver al Backlog
                </button>
                <div class="roles-admin-layout">
                    <!-- Columna Izquierda (Master: Sidebar de Roles) -->
                    <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                        <div class="admin-card"
                            style="padding: 20px; border-radius: 14px; border: 1px solid #cbd5e1; background: white; display: flex; flex-direction: column; gap: 1rem;">
                            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <i class="fa-solid fa-shield-halved" style="color: var(--primary); font-size: 1.1rem;"></i>
                                    <h3 style="margin: 0; font-family: 'Outfit'; font-weight: 700; color: var(--primary-dark); font-size: 1.1rem;">Roles</h3>
                                </div>
                                <button type="button" onclick="toggleCreateRoleBox()" id="btn-toggle-create-role"
                                    style="background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; padding: 6px 12px; border-radius: 8px; font-family: 'Outfit'; font-weight: 600; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;">
                                    <i class="fa-solid fa-plus"></i> Nuevo Rol
                                </button>
                            </div>

                            <!-- Caja Desplegable Simplificada para Crear Rol -->
                            <div id="create-role-box" style="display: none; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; transition: all 0.3s ease;">
                                <form id="create-role-form" onsubmit="handleCreateRoleSubmit(event)" style="display: flex; flex-direction: column; gap: 8px;">
                                    <label style="font-size: 0.78rem; font-weight: 600; color: #475569;">Nombre del nuevo rol:</label>
                                    <input type="text" id="new-role-name" required placeholder="Ej: auditor_catastro"
                                        style="width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Outfit'; font-size: 0.85rem; box-sizing: border-box;">
                                    <div style="display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px;">
                                        <button type="button" onclick="toggleCreateRoleBox(false)"
                                            style="background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 5px 10px; border-radius: 6px; font-family: 'Outfit'; font-size: 0.78rem; font-weight: 600; cursor: pointer;">
                                            Cancelar
                                        </button>
                                        <button type="submit"
                                            style="background: var(--primary); color: white; border: none; padding: 5px 12px; border-radius: 6px; font-family: 'Outfit'; font-size: 0.78rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                                            <i class="fa-solid fa-check"></i> Crear
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Lista Completa de Roles (Todos uno debajo del otro) -->
                            <div id="roles-list-container"
                                style="display: flex; flex-direction: column; gap: 0.65rem; padding: 2px 2px 2px 2px;">
                                <!-- Se llenará dinámicamente -->
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha (Detail: Matriz de Permisos) -->
                    <div id="permissions-detail-container" class="permissions-detail-panel">
                        <!-- Se llenará dinámicamente con renderRolePermissions(roleName) -->
                        <div style="padding: 3rem; text-align: center; color: #64748b;">
                            <i class="fa-solid fa-user-shield"
                                style="font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem;"></i>
                            <p style="margin: 0; font-weight: 600;">Seleccione un rol de la lista izquierda para editar
                                sus permisos de acceso.</p>
                        </div>
                    </div>
                </div>
            
</div>
