<div class="breadcrumbs">
    <span onclick="showView('landing')">Inicio</span> / <span onclick="window.location.hash='#/buzones/' + currentBuzonesArea">Buzones</span> / <span id="buzon-analista-breadcrumbs-area" onclick="showBuzonesView(currentBuzonesArea)">-</span> / <span id="buzon-analista-breadcrumbs-gerencia" onclick="backToBuzonGerencia()">-</span> / Analista: <b id="buzon-analista-breadcrumbs-name" style="font-weight: normal; color: var(--white);">-</b>
</div>

            <div style="margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <button onclick="backToBuzonGerencia()" class="btn-primary"
                        style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 0.88rem; background: #64748b; border: none; border-radius: 8px; color: white; cursor: pointer; font-family: 'Outfit'; font-weight: 700;">
                        <i class="fa-solid fa-arrow-left"></i> Volver al Listado
                    </button>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="exportBuzonAnalistaExcel()" class="btn-primary"
                            style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 0.88rem; background: #059669; border: none; border-radius: 8px; color: white; cursor: pointer; font-family: 'Outfit'; font-weight: 700; transition: background 0.2s;">
                            <i class="fa-solid fa-file-excel"></i> Descargar Excel
                        </button>
                    </div>
                </div>

                <!-- Header Card -->
                <div style="background: white; border-radius: 14px; border: 1px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,0.04); padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <div style="width: 44px; height: 44px; border-radius: 10px; background: rgba(14, 165, 233, 0.1); color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                        <div>
                            <h2 id="buzon-analista-header-name"
                                style="margin: 0; font-family: 'Outfit'; color: var(--primary-dark); font-weight: 800; font-size: 1.4rem;">
                                Nombre del Analista</h2>
                            <p id="buzon-analista-header-sade"
                                style="margin: 3px 0 0 0; font-size: 0.9rem; color: #64748b; font-family: 'Outfit';">Usuario SADE: @username</p>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <span id="buzon-analista-header-count" class="badge-status-propio"
                            style="font-weight: 800; font-size: 0.95rem; padding: 6px 14px; border-radius: 20px; display: inline-block; background: #e0f2fe; color: #0284c7;">0 Expedientes en Stock</span>
                    </div>
                </div>
            </div>

            <!-- Controles de Filtros para Detalle de Buzón -->
            <div style="background: white; padding: 1rem 1.25rem; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,0.04); display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
                <div style="display: flex; flex-wrap: wrap; gap: 1rem; flex-grow: 1; align-items: center;">
                    <!-- Búsqueda -->
                    <div style="position: relative; min-width: 280px; flex-grow: 1;">
                        <i class="fa-solid fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.85rem;"></i>
                        <input type="text" id="buzon-detalle-search" class="form-input"
                            placeholder="Buscar por expediente, código, descripción, motivo..."
                            oninput="filterAndRenderBuzonDetalle()"
                            style="width: 100%; padding: 9px 12px 9px 35px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Outfit'; font-size: 0.88rem; outline: none;">
                    </div>
                    <!-- Filtro Estado SADE -->
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;">Estado:</label>
                        <select id="buzon-detalle-filter-estado" onchange="filterAndRenderBuzonDetalle()"
                            style="padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Outfit'; font-size: 0.88rem; background: white; outline: none;">
                            <option value="ALL">Todos los estados</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Analyst Detail Table -->
            <div style="background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,0.04); margin-bottom: 3rem; overflow: hidden;">
                <div style="padding: 0.75rem 1rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 0.8rem; color: #64748b; display: flex; justify-content: space-between; align-items: center; font-family: 'Outfit', sans-serif;">
                    <span id="buzon-detalle-table-info">Mostrando expedientes</span>
                    <span style="font-size: 0.75rem; color: #94a3b8;"><i class="fa-regular fa-bookmark" style="color: var(--primary);"></i> Hacé clic en la estrella para marcar como favorito</span>
                </div>
                <div style="overflow-x: auto; width: 100%;">
                    <table class="matrix-table" style="margin-top: 0; width: 100%; border-collapse: collapse; text-align: left; font-family: 'Outfit', sans-serif;">
                        <thead>
                            <tr style="border-bottom: 2px solid #e2e8f0; background: #f8fafc;">
                                <th style="padding: 12px 16px; text-align: center; font-size: 0.78rem; font-weight: 700; color: #475569; width: 60px;">
                                    <i class="fa-solid fa-bookmark" title="Favorito"></i>
                                </th>
                                <th style="padding: 12px 16px; text-align: left; font-size: 0.78rem; font-weight: 700; color: #475569; width: 250px; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Expediente</th>
                                <th style="padding: 12px 16px; text-align: center; font-size: 0.78rem; font-weight: 700; color: #475569; width: 150px; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Tipo Stock</th>
                                <th style="padding: 12px 16px; text-align: left; font-size: 0.78rem; font-weight: 700; color: #475569; width: 140px; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Trata</th>
                                <th style="padding: 12px 16px; text-align: left; font-size: 0.78rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Detalle Trámite</th>
                                <th style="padding: 12px 16px; text-align: center; font-size: 0.78rem; font-weight: 700; color: #475569; width: 110px; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Días Stock</th>
                                <th style="padding: 12px 16px; text-align: center; font-size: 0.78rem; font-weight: 700; color: #475569; width: 130px; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Días Gerencia</th>
                                <th style="padding: 12px 16px; text-align: left; font-size: 0.78rem; font-weight: 700; color: #475569; width: 160px; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Último Pase</th>
                                <th style="padding: 12px 16px; text-align: left; font-size: 0.78rem; font-weight: 700; color: #475569; width: 220px; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Motivo del Último Pase</th>
                            </tr>
                        </thead>
                        <tbody id="buzon-analista-tbody">
                            <!-- Se llenará dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
