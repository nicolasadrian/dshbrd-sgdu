<div class="breadcrumbs">
                <span onclick="showView('landing')">Inicio</span> / Mis Expedientes / Asignados a Mí
            </div>

            <div
                style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h1 class="landing-title" id="asignados-mi-title" style="margin-bottom: 0.25rem;">Expedientes
                        Asignados a Mí</h1>
                    <p id="asignados-mi-subtitle" style="color: #64748b; font-size: 0.95rem; margin: 0;">Expedientes en
                        los cuales figurás como responsable de ficha.</p>
                </div>
                <div
                    style="display: flex; align-items: center; gap: 10px; background: white; padding: 8px 14px; border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                    <i class="fa-solid fa-filter" style="color: #64748b; font-size: 0.85rem;"></i>
                    <label for="filter-asignados-usuario"
                        style="font-family: 'Outfit'; font-weight: 700; color: #475569; font-size: 0.85rem; margin: 0;">Responsable:</label>
                    <select id="filter-asignados-usuario" onchange="handleAsignadosUsuarioFilterChange(this.value)"
                        style="border: none; outline: none; font-family: 'Outfit'; font-size: 0.85rem; font-weight: 600; color: #1e293b; background: transparent; cursor: pointer; min-width: 150px; padding-right: 5px;">
                        <!-- Opciones cargadas dinámicamente -->
                    </select>
                </div>
            </div>

            <!-- Contenido poblado completamente vía JS (renderAsignadosMiContent) -->
            <div id="asignados-mi-container" style="margin-bottom: 3rem;">
                <div style="text-align: center; padding: 3rem; color: #94a3b8; font-family: 'Outfit';">
                    <i class="fa-solid fa-spinner fa-spin"
                        style="font-size: 1.5rem; margin-bottom: 1rem; display: block; color: var(--primary);"></i>
                    Cargando expedientes asignados...
                </div>
            </div>
